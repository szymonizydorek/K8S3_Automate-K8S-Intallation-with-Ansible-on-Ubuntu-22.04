Comment #6 - Good job using dpkg_selections module. APT natively doensnt support hold 
- name: Hold Kubernetes Tools
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

