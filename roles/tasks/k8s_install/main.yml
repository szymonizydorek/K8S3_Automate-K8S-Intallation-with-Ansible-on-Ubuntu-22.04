Comment #1: This task is not needed. We assume the server is clean and we dont want to remove any files. What if you already have K8s installed and by accident you run this role with this task that removes some files? And then K8s cannot start?

- name: Remove Old Reposository Files
  command:
    cmd: rm -f /etc/apt/sources.list.d/kubernetes.list


Comment #2: These two  tasks (line 15-22) can be replaced with one below: 
- name: Update repositories cache and install "docker.io" package
  apt:
    name: docker.io
    update_cache: yes

- name: Update Apt Packages
  apt:
    update_cache: yes
  
- name: Install Docker Package
  apt:
    name: docker.io
    state: present


Comment #3: The same  - we dont need two tasks to make sure docker run. Replace lines 32-41 with one task that is on line 26-30
 - name: Ensure Docker is enabled and running
   service:
     name: docker
     state: started
    enabled: yes

- name: Start Docker Service
  service:
    name: docker
    enabled: yes
    state: started

- name: Verify Docker Is Running
  service:
